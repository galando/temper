## Stage 1.5: Design (medium/complex only)

Skip straight to Build when `phases.design: false`, or complexity is trivial/simple.

Launch:

```
Use the Agent tool, model: opus, prompt:
\"Follow agents/design.md exactly. Spec: {spec_path from state}.\"
```

Summary box: architecture overview, key decisions, what's new/modified/existing.

There is no `temper gate design` — this stage has no single-correct-output requirement
in v7; its quality shows up in whether Build can execute it and what Review finds. Gate
options: Continue / Grill Me / Teach Me / \"Walk through step by step\" (same shape as
Plan's — architecture overview, API contracts, database changes, integration points,
decision log; only sections `design.md` actually has) / Save / Other.

**On Continue:** `$TEMPER state advance design_complete build`, launch Build.

---

## Stage 2: Build

Launch:

```
Use the Agent tool, model: sonnet, prompt:
\"Follow agents/build.md exactly. Spec: {spec_path from state}.
{If a review-context.json or check-context.json feedback file exists, name it here.}\"
```

Summary box:

```
+-----------------------------------------------------------+
| BUILD — {Feature Name}                                    |
+-----------------------------------------------------------+
| Tasks: {N}/{N} complete   Tests: {N} added, all passing    |
| Files: {N} created, {N} modified                           |
+-----------------------------------------------------------+
```

Gate: `$TEMPER gate build` (RED-then-GREEN evidence recorded, no unchecked tasks).
Options: Continue to Review / Teach Me / \"Loop back to Plan\" (only if Build judges the
plan infeasible — human-driven, no circuit breaker, max 1 per run) / Override / Save.

**On Continue:** `$TEMPER state advance build_complete review`, launch Review.

---

## Stage 3: Review

Launch:

```
Use the Agent tool, model: haiku, prompt:
\"Follow agents/review.md exactly. Spec: {spec_path from state}.\"
```

Summary box: files changed, findings by severity, security hot paths, intent-validation
verdict, scenario coverage.

Gate: `$TEMPER gate review` (zero open findings at or above `review.block-on`). An
**\"Architecture Depth Review\"** option is also always available — runs the 5-dimension
module-depth analysis (seams, adapters, locality, leverage, deletion test) on changed
files and folds `[ARCH-DEPTH]` findings into the summary before re-showing the gate.

**On Continue:** `$TEMPER state advance review_complete check`, launch Check.

---

## Stage 4: Check

Launch:

```
Use the Agent tool, model: haiku, prompt:
\"Follow agents/check.md exactly. Spec: {spec_path from state}.\"
```

Summary box: compile/test/lint/security results, coverage %, scenario verification.

Gate: `$TEMPER gate check` (tests pass, coverage >= threshold, every `intent.md`
scenario traced to a test by name — this is the gate that catches the README's
rate-limiting story). On a clean pass, the
Check agent may also have written `{spec_path}/config-suggestions.json` (CLAUDE.md/
AGENTS.md suggestions per `reference/config-suggestions.md`) — if present, offer a
**\"Review config suggestions\"** option before Continue: show each, Accept (write it into
CLAUDE.md/AGENTS.md) / Reject / Defer, then re-show the gate.

**On Continue:** if `eval.enabled: true`, `$TEMPER state advance check_complete eval` and
launch Eval; else skip straight to the commit gate.

---

## Stage 5: Eval (optional)

Skipped with a one-line notice when `eval.enabled: false` or no `evals/evalset.json`
exists for this spec — never an error.

Launch:

```
Use the Agent tool, model: haiku, prompt:
\"Follow agents/eval.md exactly. Spec: {spec_path from state}.\"
```

Summary box: score table by dimension (grouped ARTIFACT then PROCESS per
`reference/eval.md` → \"Reading the Score Table\"), aggregate, pass/fail.

Gate: `$TEMPER gate eval` (aggregate >= `eval.pass-threshold`).

**On Continue:** `$TEMPER state advance eval_complete commit`.

---

## Commit

Run `$TEMPER gate commit`. It aggregates every upstream gate's last verdict (PASS or
overridden), and — only when `run_mode == autonomous` — blast radius and park-on-touch.

- **PASS (interactive):** `ask the user directly and wait for their answer` — \"Commit\" / \"Save for later\" / \"Other\".
  On Commit: stage the diff, `git commit` (a conventional-commit message summarizing the
  feature), then `$TEMPER state clear`.
- **PASS (autonomous):** never auto-commits (see Autonomous Continuation) — park with a
  `SHIP-PENDING-COMMIT` report instead.
- **FAIL:** show `$TEMPER report`, offer \"Override and commit\" (records the override,
  re-run `$TEMPER gate commit`, it should now PASS) or \"Save for later\".

Print the final ledger (`$TEMPER report`) either way — the last thing the user sees is
what was actually verified, not a narrated summary.

---

## Resume

If `.temper/build-state.json` exists and `the Temper unified pipeline` is called with **no arguments**,
resume: read `spec_path` and `next_stage` via `$TEMPER state get`, confirm the spec
directory and its `artifacts` still exist on disk (if not: \"Saved state is invalid —
start over / delete it?\"), then launch `next_stage`. If it's been more than 30 days since
`updated`, warn about staleness before resuming.

If `the Temper unified pipeline \"new feature\"` is called while state exists for a **different** feature, ask:
resume the existing one, or overwrite (`$TEMPER state clear` then start fresh).

If `the Temper unified pipeline` (no arguments) is called for the **same** feature already in progress, ask:
\"Continue from {next_stage} (Recommended)\" or \"Start over (replan)\".

---

## Individual Commands Still Work

```
the Temper \"plan\" stage    → Just planning, stops at gate
the Temper \"design\" stage  → Just design (for complex features), stops at gate
the Temper \"build\" stage   → Just building, stops at gate
the Temper \"review\" stage  → Just review, stops at gate
the Temper \"check\" stage   → Just check, stops at gate
```

These run directly in the current context (no inline execution) — use them for granular
control. They still call `$TEMPER gate {stage}` at their own gate.

## Gate Protocol (do not skip)

Every stage's verdict is computed by the CLI from an evidence ledger, never
self-asserted:

```
scripts/temper evidence add --stage <stage> --claim \"...\" --cmd \"...\" --exit <code> --label PROVEN
scripts/temper gate <stage>
```

Paths above are relative to this plugin's own installed root (wherever the
marketplace source resolved this repo on disk), not necessarily your project's working
directory — resolve `scripts/temper` to that location if your shell's cwd differs.
"""
