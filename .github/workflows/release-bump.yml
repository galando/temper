name: Release Bump

# Manual one-button release bump. A human clicks "Run workflow", types the
# target version; CI bumps all version stamps, inserts a CHANGELOG entry
# (auto-generated by default from commit messages since the last tag, or a stub
# to fill in), validates, and opens a PR.
#
# Relationship to sibling workflows:
#   - quality.yml   : runs the validators on every push/PR (unchanged)
#   - release.yml   : creates the GitHub Release on `git tag v*` (unchanged)
#   - release-bump.yml (this): manual bump + open PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (e.g. 5.4.0) — no 'v' prefix"
        required: true
        type: string
      changelog_title:
        description: "CHANGELOG entry title (after the em-dash). e.g. 'Release Bump Automation'. Leave blank to derive one from the dominant commit type."
        required: false
        type: string
        default: ""
      generate_notes:
        description: "Auto-generate a concise one-paragraph CHANGELOG body from commit messages since the last tag. Uncheck to leave a stub to fill in manually."
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

# Only one release bump at a time; never cancel an in-flight one mid-bump.
concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the default branch with full history (tag comparison needs it).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Validate the target version is semver AND strictly greater than current.
      #    Catches typos that would silently downgrade the plugin.
      - name: Validate target version
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '$TARGET_VERSION' is not X.Y.Z"
            exit 1
          fi
          CURRENT=$(grep -m1 '"version"' .claude-plugin/plugin.json | sed 's/.*"\([0-9.][0-9.]*\)".*/\1/')
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$TARGET_VERSION" | sort -V | tail -1)
          if [ "$TARGET_VERSION" = "$CURRENT" ]; then
            echo "ERROR: target ($TARGET_VERSION) equals current ($CURRENT) — nothing to bump"
            exit 1
          fi
          if [ "$NEWEST" != "$TARGET_VERSION" ]; then
            echo "ERROR: target ($TARGET_VERSION) must be greater than current ($CURRENT)"
            exit 1
          fi
          echo "OK: bumping $CURRENT -> $TARGET_VERSION"

      # 3. Insert a CHANGELOG entry BEFORE the bump. validate-plugin.sh asserts the
      #    top CHANGELOG version matches plugin.json, so the entry must exist in the
      #    same commit or the gate fails. By default the body is AUTO-GENERATED as a
      #    concise one-paragraph summary of conventional-commit messages since the
      #    last well-formed tag; set generate_notes=false to leave a stub instead.
      #    Multi-line insertion via here-doc + head/tail splice (awk -v chokes on
      #    newlines in the body string).
      - name: Insert CHANGELOG entry
        env:
          TARGET_VERSION: ${{ inputs.version }}
          CHANGELOG_TITLE: ${{ inputs.changelog_title }}
          GENERATE_NOTES: ${{ inputs.generate_notes }}
        run: |
          set -euo pipefail

          # --- Derive title if not supplied ---
          TITLE="$CHANGELOG_TITLE"
          if [ -z "$TITLE" ]; then
            # Find the last well-formed vX.Y.Z tag (this repo has stray malformed
            # tags like 'v.5.2.0'; filter to the canonical pattern).
            LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [ -n "$LAST_TAG" ]; then
              RANGE="${LAST_TAG}..HEAD"
            else
              RANGE="HEAD"
            fi
            # Dominant conventional-commit type across the range decides the title verb.
            DOM_TYPE=$(git log --pretty=format:"%s" "$RANGE" 2>/dev/null \
                       | sed -nE 's/^([a-z]+)(\(.+\))?:.*/\1/p' \
                       | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')
            case "$DOM_TYPE" in
              feat)     TITLE="New Features" ;;
              fix)      TITLE="Fixes" ;;
              perf)     TITLE="Performance" ;;
              refactor) TITLE="Refactor" ;;
              docs)     TITLE="Documentation" ;;
              ci)       TITLE="CI / Tooling" ;;
              chore)    TITLE="Maintenance" ;;
              *)        TITLE="Release" ;;
            esac
          fi

          # --- Build the body ---
          if [ "$GENERATE_NOTES" = "true" ]; then
            # Collect conventional-commit subjects since the last tag, condense into
            # one paragraph: strip the 'type(scope): ' prefix, lowercase the first
            # letter, drop merge/chore noise, dedupe, join with '; ', cap length.
            LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            RANGE="${LAST_TAG:+${LAST_TAG}..HEAD}"
            RANGE="${RANGE:-HEAD}"
            BODY=$(git log --no-merges --pretty=format:"%s" "$RANGE" 2>/dev/null \
                   | grep -vE '^[a-z]+(\(.+\))?: (bump|chore|release)' \
                   | sed -E 's/^[a-z]+(\([^)]+\))?:[[:space:]]*//' \
                   | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
                   | awk '{print tolower(substr($0,1,1)) substr($0,2)}' \
                   | awk 'NF' \
                   | awk '!seen[$0]++')
            # Join with '; ' (portable: paste -sd '; ' mis-uses the space as a
            # terminator on both BSD and GNU). Capitalize the first letter of the
            # paragraph so it reads as prose.
            BODY=$(printf '%s\n' "$BODY" | awk 'BEGIN{ORS="; "} {print} END{if(NR>0)printf ""}' | sed -E 's/; $//')
            if [ -z "$BODY" ]; then
              # No usable commit subjects (e.g. all chore/release commits) — fall back.
              BODY="Maintenance and tooling updates."
            fi
            # Capitalize the first character of the paragraph.
            BODY="$(printf '%s' "${BODY:0:1}" | tr '[:lower:]' '[:upper:]')${BODY:1}"
            # Cap to ~600 chars at a sentence boundary to stay one tight paragraph.
            if [ "${#BODY}" -gt 600 ]; then
              BODY="${BODY:0:597}..."
            fi
            echo "Auto-generated notes ($RANGE): $BODY"
          else
            BODY="_Replace this placeholder with release notes before merging._ - (add entries here)"
          fi

          # --- Splice the entry into CHANGELOG.md before the first '## v' ---
          {
            echo "## v${TARGET_VERSION} — ${TITLE}"
            echo ""
            echo "${BODY}"
            echo ""
          } > /tmp/changelog-entry.md
          FIRST_V=$(grep -n '^## v' CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$FIRST_V" ]; then
            echo "ERROR: no '## v' entry found in CHANGELOG.md to splice before"
            exit 1
          fi
          head -n $((FIRST_V - 1)) CHANGELOG.md > CHANGELOG.md.new
          cat /tmp/changelog-entry.md >> CHANGELOG.md.new
          tail -n +${FIRST_V} CHANGELOG.md >> CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md
          echo "Inserted CHANGELOG entry: v${TARGET_VERSION} — ${TITLE}"

      # 4. Run the bump. version-bump.sh is the single writer: it rewrites all
      #    live source stamps — every agent manifest (.claude-plugin,
      #    .cursor-plugin, .codex-plugin, .agents/plugins, plugin.json), plus
      #    CLAUDE.md, AGENTS.md and the temper.md header. Adding a new agent
      #    surface means adding it there, not here.
      - name: Bump version
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: ./scripts/version-bump.sh "$TARGET_VERSION"

      # 5. Gate: prove the tree is consistent before opening a PR. quality-check.sh
      #    runs JSON/structure checks but does NOT run the version-agreement guard —
      #    that lives only in validate-plugin.sh. Run all three validators explicitly
      #    so stamp drift cannot slip through.
      - name: Validate (gate)
        run: |
          set -euo pipefail
          bash scripts/quality-check.sh
          bash scripts/validate-plugin.sh
          bash scripts/validate-docs.sh
          bash scripts/validate-readme.sh

      # 6. Commit to a release branch and open a PR. peter-evans/create-pull-request
      #    is idempotent: re-running with the same version updates the existing PR.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(release): v${{ inputs.version }} — ${{ inputs.changelog_title }}"
          branch: "release/v${{ inputs.version }}"
          title: "chore(release): v${{ inputs.version }} — ${{ inputs.changelog_title }}"
          body: |
            Automated release bump.

            **Version:** `${{ inputs.version }}`

            - Bumps all version stamps (`version-bump.sh`)
            - Inserts a CHANGELOG entry — auto-generated from commits since the last tag (edit before merging if you want more detail)
            - All validators passed (`quality-check.sh`, `validate-plugin.sh`, `validate-docs.sh`, `validate-readme.sh`)

            **After merge:** tag the release to publish it.
            ```bash
            git tag v${{ inputs.version }}
            git push --tags
            ```
            `release.yml` then creates the GitHub Release.
          labels: release
          delete-branch: true
