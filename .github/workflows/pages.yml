name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The videos stay out of the plugin tree (the directory holds a plugin that ships media).
      # They live in one pinned commit and are restored here, so Pages serves them as video/mp4.
      - name: Restore the videos
        env:
          MEDIA_SHA: 3690f59e939d0c5461fcaf9a159400c0068e7e2c
        run: |
          git fetch --depth 1 origin "$MEDIA_SHA"
          mkdir -p docs/media
          # Each file by its blob id in that commit: the workflow video and its poster, then the mod tour.
          git cat-file blob 35abb2ad7e9889f6a96bdf033c5753f9532c981a > docs/media/workflow.mp4
          git cat-file blob 76d8a2fe0b63d121226e419ae0187b27eeb34d6f > docs/media/workflow.jpg
          git cat-file blob 4941b78d60f1c72fcedaa2512e827a8d818da22e > docs/media/tour.mp4
          git cat-file blob e45f1e72a53d47964e05c818d4448e930541445c > docs/media/tour.jpg
          # A missing or broken file fails the deploy here, instead of a page whose players stay black.
          for f in workflow tour; do
            test "$(stat -c %s "docs/media/$f.mp4")" -gt 1000000 || { echo "::error::docs/media/$f.mp4 is missing or too small"; exit 1; }
            head -c 12 "docs/media/$f.mp4" | grep -q ftyp || { echo "::error::docs/media/$f.mp4 is not an MP4 file"; exit 1; }
            test "$(stat -c %s "docs/media/$f.jpg")" -gt 10000 || { echo "::error::docs/media/$f.jpg is missing or too small"; exit 1; }
          done
          ls -l docs/media

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The live site serves each video as video/mp4 with byte ranges (what a browser's player needs); a red run says so.
      - name: Check the videos on the live site
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for f in workflow.mp4 tour.mp4 workflow.jpg tour.jpg; do
            ok=""
            for i in 1 2 3 4 5 6; do
              h="$(curl -sSI -H 'Range: bytes=0-1023' "${SITE%/}/media/$f" || true)"
              if grep -qiE '^HTTP/[0-9.]+ 206' <<<"$h" && grep -qiE '^content-type: (video/mp4|image/jpeg)' <<<"$h"; then ok=1; break; fi
              sleep 20
            done
            [ -n "$ok" ] || { echo "::error::${SITE%/}/media/$f is not served as a playable file"; echo "$h"; exit 1; }
            echo "ok: $f"
          done
