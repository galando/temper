name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The videos stay out of the plugin tree (the directory holds a plugin that ships media).
      # They live in one pinned commit and are restored here, so Pages serves them as video/mp4.
      - name: Restore the videos
        env:
          MEDIA_SHA: 07228492dbed8e80acf7676c592a681ffa54ba1d
        run: |
          git fetch --depth 1 origin "$MEDIA_SHA"
          mkdir -p docs/media
          for f in temper-sdlc temper-mod; do
            git show "$MEDIA_SHA:docs/assets/$f.mp4" > "docs/media/$f.mp4"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
