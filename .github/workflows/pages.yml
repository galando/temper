name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The videos stay out of the plugin tree (the directory holds a plugin that ships media).
      # They live in one pinned commit and are restored here, so Pages serves them as video/mp4.
      - name: Restore the videos
        env:
          MEDIA_SHA: a77c3396989fa5a37bd7c9daaf338b6c5e72205b
        run: |
          git fetch --depth 1 origin "$MEDIA_SHA"
          mkdir -p docs/media
          # Each file by its blob id in that commit: the workflow video and its poster, then the mod tour.
          git cat-file blob d55a8b50f614d5b4bf32644f0cfc637985c198cf > docs/media/workflow.mp4
          git cat-file blob da0950b8a5811acaf3adf5c184d9ec5435bc10b3 > docs/media/workflow.jpg
          git cat-file blob bdbe503e8036b64844ac401fe45b23d00b8b3cc3 > docs/media/tour.mp4
          git cat-file blob 24e3f2a050be1a5214b7c5d2515ca83839286d20 > docs/media/tour.jpg

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
