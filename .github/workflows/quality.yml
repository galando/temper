name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run quality-check.sh
        run: bash scripts/quality-check.sh

  temper-cli:
    name: temper CLI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test-temper.sh
        run: bash scripts/tests/test-temper.sh

  validate-readme:
    name: README Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-readme.sh
        run: bash scripts/validate-readme.sh

  validate-docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-docs.sh
        run: bash scripts/validate-docs.sh

  validate-plugin:
    name: Plugin Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-plugin.sh
        run: bash scripts/validate-plugin.sh

  validate-manifest:
    name: Official Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run claude plugin validate --strict
        run: claude plugin validate --strict .
