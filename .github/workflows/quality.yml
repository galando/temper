name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run quality-check.sh
        run: bash scripts/quality-check.sh

  temper-cli:
    name: temper CLI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test-temper.sh
        run: bash scripts/selftest/test-temper.sh

  validate-readme:
    name: README Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-readme.sh
        run: bash scripts/validate-readme.sh

  validate-directory:
    name: Directory Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test validate-directory.sh
        run: bash scripts/selftest/test-validate-directory.sh
      - name: Run validate-directory.sh
        run: bash scripts/validate-directory.sh

  validate-docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-docs.sh
        run: bash scripts/validate-docs.sh

  validate-plugin:
    name: Plugin Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-plugin.sh
        run: bash scripts/validate-plugin.sh

  validate-panels:
    name: Stage Panel Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validate-panels.py
        run: python3 scripts/validate-panels.py

  validate-manifest:
    name: Official Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run claude plugin validate --strict
        run: claude plugin validate --strict .

  e2e:
    # The whole flow of a run on a throwaway mock project, with the real CLI: Intent, Plan, Design, the grouped Build,
    # Review, Check, Commit, the pull request and Pipeline, a fix run and the small change window. Each scenario runs
    # without the mod (plain), with the mod's rule engine guarding every call (mod), and carried by the mod's run
    # driver (driver); a scenario fails when the flow with the mod differs from the flow without it. The pyjokes scenarios
    # (scripts/e2e/pyjokes.ts) replay the faults of 9.8.4 on a second mock project.
    name: End to end (plain, mod, driver)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4   # the version the scenarios were run with
      - name: Run every scenario in every mode
        run: bun scripts/e2e/run.ts all

  mod:
    name: Mod (Claude Code 2.1.287)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code 2.1.287
        run: npm install -g @anthropic-ai/claude-code@2.1.287
      - name: claude plugin test (no sign in needed)
        run: claude plugin test .
      - name: claude plugin validate --strict
        run: claude plugin validate --strict .
      - name: Generate the mod types
        # Loading the plugin writes .claude-plugin/types/. No key or login is set: the load happens before
        # Claude Code would need one, and the step fails when the types are missing.
        run: |
          timeout 120 claude -p "hi" --plugin-dir . --debug-file "$RUNNER_TEMP/mod-debug.log" || true
          test -f .claude-plugin/types/claude-code/index.d.ts || { tail -40 "$RUNNER_TEMP/mod-debug.log" || true; exit 1; }
      - name: Type check the mod (tsc via tsconfig.mod.json)
        run: npx -p typescript@5.6 tsc -p tsconfig.mod.json
      - name: Assert the reviewed calls list
        run: |
          bash scripts/selftest/test-check-mod-calls.sh
          bash scripts/check-mod-calls.sh
      - name: The documented limits of the guard
        run: bash scripts/check-known-limits.sh
