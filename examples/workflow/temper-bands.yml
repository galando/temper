# temper-bands.yml — copy into a PROJECT's .github/workflows/ (not this plugin's).
#
# The closing-the-loop trigger layer: a scheduled job runs `temper bands` — pure
# arithmetic over the project's committed .temper/metrics.json history, no model, no
# tokens — and only on a 2sigma+ breach invokes Claude to draft the breach as a
# Stage-1 intent.md and open a PR carrying it. The PR is the escalation: a human
# triages it (fix now / schedule / dismiss), and if accepted the intent rides the
# ordinary /temper pipeline through every gate. Nothing deploys, reverts, or merges
# from here — the loop closes into the review gate, not around it.
#
# REQUIRES (read before enabling — three real settings, not just the block below):
#   1. .temper/metrics.json committed to the repo (the two metric arrays are meant to
#      be committed; see the temper repo's .gitignore). AND .temper/specs/ must NOT be
#      gitignored in your project, or the drafted intent can't be committed — the guard
#      step below fails with a clear message rather than a cryptic git error if it is.
#   2. ANTHROPIC_API_KEY in Actions secrets.
#   3. Settings → Actions → General → "Allow GitHub Actions to create and approve pull
#      requests" ENABLED (off by default) — `gh pr create` with the built-in token
#      fails without it. NOTE: a PR opened by the built-in GITHUB_TOKEN does NOT trigger
#      other workflows' `on: pull_request` (GitHub's recursion guard), so your
#      temper-review.yml will NOT auto-run on the breach PR. To get the review gate on
#      it, either (a) use a PAT/App token here instead of github.token, or (b) run the
#      review when a human pushes to the PR. This template deliberately uses the
#      built-in token (no PAT to manage); the trade-off is that the human triaging the
#      PR kicks the review.
name: Temper control bands
on:
  schedule:
    - cron: "23 5 * * *" # daily, off-peak
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bands:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch temper (the CLI is enough for detection)
        run: git clone --depth 1 --branch v8.0.0 https://github.com/galando/temper /tmp/temper

      - name: Deterministic band check
        id: bands
        run: |
          set +e
          /tmp/temper/scripts/temper bands
          echo "breach=$?" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.bands.outputs.breach == '1'
        with:
          node-version: 22

      - name: Draft the breach as an intent.md (2sigma+ only)
        if: steps.bands.outputs.breach == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          SLUG="bands-breach-$(date -u +%Y%m%d-%H%M)"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          IS_SANDBOX=1 claude -p "Read .temper/bands.json (a temper control-band breach). \
          Draft .temper/specs/$SLUG/intent.md exactly per the temper plugin's \
          reference/status.md Step 3.7: header with **Author:** temper bands, \
          **Status:** draft, **Created:** today; Problem = the breach verbatim (metric, \
          latest, baseline, z — evidence, not narrative); Success Criteria = the metric \
          back inside its bands with Validate: metric. Write that one file, nothing else." \
            --plugin-dir /tmp/temper \
            --dangerously-skip-permissions

      - name: Open the escalation PR
        if: steps.bands.outputs.breach == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INTENT=".temper/specs/${SLUG}/intent.md"
          # Guard the two states a naive `git add .temper/specs/` fails on: the draft
          # was never written, or the path is gitignored (git add would exit 1/128).
          if [ ! -f "$INTENT" ]; then
            echo "::error::Expected drafted intent at $INTENT was not created — not opening a PR."
            exit 1
          fi
          git config user.name "temper-bands"
          git config user.email "temper-bands@users.noreply.github.com"
          git add "$INTENT"
          if git diff --cached --quiet; then
            echo "::error::$INTENT is gitignored (nothing staged) — un-ignore .temper/specs/ to use this workflow, or commit intents to a tracked path."
            exit 1
          fi
          BRANCH="temper/${SLUG}"
          git checkout -b "$BRANCH"
          git commit -m "docs(intent): control-band breach — draft intent for triage"
          git push -u origin "$BRANCH"
          gh pr create --fill --title "Control-band breach: triage this intent draft" \
            --body "Deterministic \`temper bands\` breach. Triage: run \`/temper\` on this intent, schedule it, or dismiss (dismissals are the band-tuning signal). Note: the review workflow does not auto-run on a bot-opened PR — push or re-run it to trigger the review gate."
