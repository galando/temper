# temper-review.yml — copy into a PROJECT's .github/workflows/ (not this plugin's).
#
# The AI-in-the-PR-review-loop pattern, temper-flavored: /temper:review runs headlessly
# against the PR diff, records findings as evidence (`temper evidence add`), and then —
# the part that matters — the MERGE CHECK is `temper gate review`: a deterministic
# verdict computed from the evidence ledger against the project's own
# `review.block-on` config, never a model's self-assessment. Model findings inform;
# the gate decides; branch protection + a human code owner still own the approval.
#
# Two failure modes this template guards against, because a naive version fails OPEN:
#   1. Fork PRs have no ANTHROPIC_API_KEY (secrets aren't shared to forks) — the
#      check-secret job skips cleanly instead of going red on every contributor PR.
#   2. `temper gate review` reads an empty ledger as "0 findings -> PASS", so a review
#      that never actually ran (plugin didn't load, run cut short) would pass the merge
#      check silently. The review is asked to record a completion marker, and a guard
#      step fails the job if that marker is absent — so a vacuous PASS can't slip.
#
# Setup: ANTHROPIC_API_KEY in the repo's Actions secrets; pin a temper tag you've
# reviewed (it runs with --dangerously-skip-permissions inside the runner sandbox).
name: Temper review
on:
  pull_request:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has-key=true" >> "$GITHUB_OUTPUT"
          else echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not available (expected on fork PRs) — skipping Temper review."
          fi

  review:
    needs: check-secret
    if: needs.check-secret.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # /temper:review diffs against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code + Temper
        run: |
          npm install -g @anthropic-ai/claude-code
          git clone --depth 1 --branch v8.1.0 https://github.com/galando/temper /tmp/temper

      - name: Headless review (writes the evidence ledger + a completion marker)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          /tmp/temper/scripts/temper init
          IS_SANDBOX=1 claude -p "Run /temper:review on this PR. When the review is
          complete, record a completion marker so CI can tell a clean review from a
          review that never ran: temper evidence add --stage review --claim 'review
          completed' --label HEURISTIC" \
            --plugin-dir /tmp/temper \
            --dangerously-skip-permissions

      - name: Prove the review actually ran (guard the fail-open)
        run: |
          # An empty/absent ledger makes `temper gate review` print PASS (0 findings).
          # Require the completion marker before trusting that PASS — a review that
          # never recorded anything must fail the check, not pass it silently.
          if ! grep -q "review completed" .temper/evidence/review.json 2>/dev/null; then
            echo "::error::Temper review did not record a completion marker — treating as review-did-not-run, failing the check rather than passing vacuously."
            exit 1
          fi

      - name: Gate on the deterministic verdict, not the narration
        run: |
          /tmp/temper/scripts/temper gate review
          # exit 0 = no findings at/above review.block-on; nonzero fails this check.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temper-review-ledger
          path: |
            .temper/evidence/
            .temper/gates.json
          if-no-files-found: ignore
