schema_version: "1.1"
name: init-scaffolds-project
description: >-
  /temper:init sets up a never-before-configured git repo: creates
  .claude/temper.config from the default template, scaffolds .temper/, and installs
  the native commit-gate pre-commit hook.
tags: [init, setup]
runs: 3

execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash]

context:
  scaffold_script: scaffold.sh
